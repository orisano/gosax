name: main
on: push
jobs:
  build:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        go: [ '1.23', '1.24', '1.25' ]
    name: go ${{ matrix.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race -v ./...
